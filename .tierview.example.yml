# Copy to .tierview.yml in your repo. Everything is optional; defaults are in config/default-rules.yml.
version: 1

thresholds: { tier2: 30, tier3: 60 }

budget: { max_cost_usd: 1.00 }   # API-equivalent USD on the claude-code backend

# Fable 5.2 on the claude-code backend is opt-in: on some plans it uses paid extra usage, and `claude -p`
# does not ask first. Without this (or --allow-fable), Tier 3 runs on Opus 5.5.
# allowFable: true

backend:
  default: claude-code           # or api (needs ANTHROPIC_API_KEY)
  claude_code: { max_hunks_per_call: 40 }

ignore:
  - "docs/**"

rules:
  - { paths: ["src/billing/**"], min_tier: 3 }   # always send billing code to the top model
  - { paths: ["scripts/**"], max_tier: 1 }       # never spend more than Sonnet on scripts

signals:
  churn: { enabled: false }
  auth: { weight: 45 }
