name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck and test
        run: npm run check
      - run: npm run build
      - name: The Action bundle is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: git diff --exit-code -- dist/action.js
      - name: Pack and run the tarball the way npx would (no model calls)
        run: |
          npm pack --silent
          dir="$(mktemp -d)"
          cp tierview-*.tgz "$dir/"
          cd "$dir"
          npm init -y >/dev/null
          npm install --silent ./tierview-*.tgz
          npx --no-install tierview --version
          git -C "$GITHUB_WORKSPACE" diff HEAD~1 > change.diff || true
          npx --no-install tierview review --dry-run --diff-file change.diff
